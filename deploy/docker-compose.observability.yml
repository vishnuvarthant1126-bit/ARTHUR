# Monitoring only: ARTHUR keeps running on Windows (all features, including app control),
# Prometheus + Grafana run in Docker. Verified 2 Oct 2026 - see docs/DOCKER.md.
# (For ARTHUR itself in a container use docker-compose.yml in the project folder.)
#
#   1. .env:  ALLOWED_HOSTS=host.docker.internal
#   2. Start ARTHUR as usual:  uvicorn app.main:app
#   3. docker compose -f deploy/docker-compose.observability.yml up -d
#   4. Grafana: http://127.0.0.1:3000  (dashboard "ARTHUR")   Prometheus: http://127.0.0.1:9090
#
# ARTHUR keeps listening on 127.0.0.1 only: Docker Desktop passes host.docker.internal on
# to it (verified - the target showed "up"). Never start ARTHUR with --host 0.0.0.0 for
# this; it has no login.
name: arthur-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.host.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
