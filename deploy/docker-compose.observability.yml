# Prometheus + Grafana for ARTHUR.  NOT TESTED YET - Docker Desktop isn't installed
# on the development machine; this is checked in Session 10.
#
#   1. .env:  ALLOWED_HOSTS=host.docker.internal
#   2. Start ARTHUR:  uvicorn app.main:app --host 0.0.0.0   <- only together with the note below
#   3. docker compose -f deploy/docker-compose.observability.yml up -d
#   4. Grafana: http://localhost:3000  (dashboard "ARTHUR")   Prometheus: http://localhost:9090
#
# Note on step 2: containers reach the host through a virtual network, so ARTHUR must
# listen on more than 127.0.0.1 for Prometheus to scrape it. ARTHUR has no login - only do
# this on a trusted network, or keep using the built-in /dashboard.html instead.
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
