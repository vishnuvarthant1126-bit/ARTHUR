# Prometheus: fetch ARTHUR's numbers every 5 seconds and keep the history.
# Used by docker-compose.yml (ARTHUR itself runs in a container).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: arthur
    metrics_path: /metrics
    static_configs:
      # "arthur" is the service name in docker-compose.yml; inside Docker's private network
      # service names work like host names. ARTHUR's Host allow-list must contain it
      # (ALLOWED_HOSTS: arthur in docker-compose.yml).
      - targets: ["arthur:8000"]
