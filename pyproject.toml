[project]
name = "arthur"
version = "0.1.0"
description = "ARTHUR - Personal Multimodal AI Agent"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: talks to real local services (Ollama); skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

# Coverage: which lines of app/ ran during the tests.   pytest --cov
# It shows where there are NO tests - it cannot say the tests are good.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 88          # the suite fails if coverage drops below this
show_missing = true
skip_covered = true
exclude_also = ["raise NotImplementedError", "if __name__ == .__main__.:"]
